# 保留 Greene Lab 模板的 Jekyll 配置与插件。
title: 李建江课题组
description: 北京科技大学李建江课题组，研究高性能计算、并行与分布式系统、云计算与大数据。
url: "https://thefly6.github.io"
baseurl: ""
# Google Search Console 的公开验证标识；验证成功后仍需保留。
google_site_verification: "MHs2HiN4OVxke_pajT57NCcAlCY_WsPziCcv8quTOf4"
# 临时演示遮罩，仅阻止随手浏览；关闭后重新构建发布即可恢复。
preview_gate:
  enabled: true
  code_sha256: "90dbb3c553a94c18852147a381f66e954b5c87519292e631095574316d875554"
timezone: Asia/Shanghai
lang: zh-CN
proofer: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
collections:
  members:
    output: false
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
highlighter: rouge
theme: null
sass:
  sass_dir: _styles
include:
  - _styles
exclude:
  - README.md
  - TODO.md
  - FINAL_REPORT.md
  - LICENSE.md
  - CITATION.cff
  - CHANGELOG.md
  - docs
  - scripts
  - vendor
  - node_modules
  - .bundle
  - .local
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - start.ps1
  - start.sh
  - tests
  - blog
  - contact
  - projects
  - research
  - team
  - testbed.md
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
