# 手动运行才会部署；本地开发不会触发发布。
name: 手动发布已审核网站到 GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - name: 构建静态网站
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl '${{ steps.pages.outputs.base_path }}'
      - name: 检查内部链接与双语路由
        run: python3 scripts/check_site.py --baseurl '${{ steps.pages.outputs.base_path }}'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
